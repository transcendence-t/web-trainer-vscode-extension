<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作室交接日志</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>工作室交接日志</h1>
  <section class="log-panel" aria-label="值班交接记录">
    <header class="log-toolbar">
      <h2>今日记录</h2>
      <a href="#latest">跳到最新记录</a>
    </header>
    <ol class="log-entries">
      <li id="first-log">09:00 开门后确认备用钥匙在前台。</li>
      <li>09:40 将绘图板移到东侧工作台。</li>
      <li>10:30 核对周末工作坊报名名单。</li>
      <li>11:10 清空回收箱并补充打印纸。</li>
      <li>13:00 为下午的访客预留两张桌子。</li>
      <li>14:20 把试用样品移到展示架下层。</li>
      <li>15:10 归档完成的工作台预约单。</li>
      <li id="latest">16:30 已确认明早的值班人员。</li>
    </ol>
  </section>
</main>
</body>
</html>
