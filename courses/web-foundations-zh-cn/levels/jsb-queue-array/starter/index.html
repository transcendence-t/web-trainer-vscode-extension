<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>把最后一个队列成员移到开头</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>把最后一个队列成员移到开头</h1>
    <p>试一试 <code>rotateLast(["一组","二组","三组"])</code></p>
    <p>运行结果 <output id="example-result" aria-live="polite">待填写函数</output></p>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const result = rotateLast(["一组","二组","三组"]);
        if (result !== undefined) {
          document.querySelector("#example-result").textContent = JSON.stringify(result);
        }
      });
    </script>
  </main>
</body>
</html>
