<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>共享设备预约</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>共享设备预约</h1>
  <div class="equipment-stage">
    <div class="equipment-grid">
      <article class="equipment-card" id="projector">
        <h2>便携投影仪</h2>
        <p>适合小组展示。归还前请清点线材。</p>
      </article>
      <article class="equipment-card" id="recorder">
        <h2>录音套件</h2>
        <p>内含录音笔、领夹麦克风和转接线。</p>
      </article>
    </div>
  </div>
</main>
</body>
</html>
