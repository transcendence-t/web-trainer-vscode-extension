<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>按首次出现顺序给编号去重</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>按首次出现顺序给编号去重</h1>
    <p>试一试 <code>uniqueCodes(["B","A","B","C","A"])</code></p>
    <p>运行结果 <output id="example-result" aria-live="polite">待填写函数</output></p>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const result = uniqueCodes(["B","A","B","C","A"]);
        if (result !== undefined) {
          document.querySelector("#example-result").textContent = JSON.stringify(result);
        }
      });
    </script>
  </main>
</body>
</html>
