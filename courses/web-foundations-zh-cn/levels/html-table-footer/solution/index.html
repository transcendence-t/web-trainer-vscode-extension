<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>把合计放进表格页脚</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>把合计放进表格页脚</h1>
    <table>
      <caption>修补材料领用记录</caption>
      <thead><tr><th scope="col">材料</th><th scope="col">数量</th></tr></thead>
      <tbody>
        <tr><th scope="row">帆布</th><td>4</td></tr>
        <tr><th scope="row">织带</th><td>6</td></tr>
      </tbody>
      <tfoot>
        <tr><th scope="row">合计</th><td>10</td></tr>
      </tfoot>
    </table>
  </main>
</body>
</html>
