<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>画出一个可以清除的状态图标</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>画出一个可以清除的状态图标</h1>
    <button type="button" id="draw">绘制图标</button> <button type="button" id="clear">清除</button>
    <p><canvas id="badge" width="72" height="48" aria-label="状态标记示意">画布中显示一块可清除的绿色矩形。</canvas></p>
  </main>
</body>
</html>
