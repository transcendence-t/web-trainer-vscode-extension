<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>剧场排班看板</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>剧场排班看板</h1>
  <div class="show-board">
    <section class="card show-overview">
      <h2>本日概况</h2>
      <p>两场演出分别在 14:00 和 19:30 开始。</p>
    </section>
    <section class="card stage-crew">
      <h2>舞台协作</h2>
      <p>开场前一小时检查灯光和字幕。</p>
    </section>
    <section class="card front-desk">
      <h2>检票安排</h2>
      <p>各场开演前四十分钟开放检票。</p>
    </section>
  </div>
</main>
</body>
</html>
