<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理原生对话框的打开、关闭和焦点</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>管理原生对话框的打开、关闭和焦点</h1>
    <button id="open" type="button">打开说明</button>
    <dialog id="rules-dialog" aria-labelledby="rules-title">
      <h2 id="rules-title">借用前核对器材</h2>
      <p>损坏时请先联系值班人员。</p>
      <button id="dismiss" type="button">关闭说明</button>
    </dialog>
  </main>
</body>
</html>
