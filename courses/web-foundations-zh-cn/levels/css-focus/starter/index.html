<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课堂资料筛选</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>课堂资料筛选</h1>
  <div class="field">
    <label for="topic-filter">按主题筛选</label>
    <input id="topic-filter" type="search" placeholder="例如网页排版">
  </div>
  <div class="field">
    <label for="author-filter">按作者筛选</label>
    <input id="author-filter" type="search" placeholder="例如李老师">
  </div>
</main>
</body>
</html>
