<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>随格式状态调整必填输入框</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>随格式状态调整必填输入框</h1>
    <label for="contact">联系人邮箱</label>
    <input id="contact" type="email" required aria-describedby="contact-rule">
    <p id="contact-rule">填写包含 @ 的有效邮箱地址。</p>
  </main>
</body>
</html>
