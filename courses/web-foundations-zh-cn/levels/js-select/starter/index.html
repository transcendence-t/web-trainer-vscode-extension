<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>周末博物馆导览</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>周末博物馆导览</h1>
  <label for="tour">导览场次</label>
  <select id="tour">
    <option value="">请选择导览</option>
    <option value="ceramics">陶艺馆上午场</option>
    <option value="clocks">钟表馆下午场</option>
    <option value="prints">版画馆傍晚场</option>
  </select>
  <p><output id="meeting-point">请先选择导览场次。</output></p>
</main>
</body>
</html>
