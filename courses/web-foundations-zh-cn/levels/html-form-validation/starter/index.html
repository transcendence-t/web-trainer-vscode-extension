<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自助取件</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>自助取件</h1>
  <form>
    <label for="pickup-code">取件码</label>
    <input type="text" id="pickup-code" name="pickup">
    <p>取件码由两位大写英文字母和四位数字组成，如 AB0427。</p>
    <button type="submit">核对</button>
  </form>
</main>
</body>
</html>
