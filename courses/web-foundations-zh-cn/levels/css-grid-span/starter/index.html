<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>徒步集合公告</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>徒步集合公告</h1>
  <div class="route-board">
    <section class="card route-notice">
      <h2>集合地点变更</h2>
      <p>本周六改在湿地公园西门集合，签到时间仍为上午 9:00。</p>
    </section>
    <section class="card route-map">
      <h2>路线安排</h2>
      <p>由西门沿湖步道绕行一圈。</p>
    </section>
    <section class="card gear-list">
      <h2>装备清单</h2>
      <p>水壶、遮阳帽和防滑鞋。</p>
    </section>
  </div>
</main>
</body>
</html>
