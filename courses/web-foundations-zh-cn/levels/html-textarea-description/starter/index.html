<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>给多行说明添加长度限制和填写提示</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>给多行说明添加长度限制和填写提示</h1>
    <form>
      <label for="reason">申请说明</label>
      <p id="reason-guide">说明借用目的，不超过 120 字。</p>
      <input id="reason" name="reason">
      <button type="submit">提交</button>
    </form>
  </main>
</body>
</html>
