<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>换下队列中指定位置的旧件</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>换下队列中指定位置的旧件</h1>
    <p>试一试 <code>swapDevice(["电源","小灯","护具"], 1, "探头")</code></p>
    <p>运行结果 <output id="example-result" aria-live="polite">待填写函数</output></p>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const result = swapDevice(["电源","小灯","护具"], 1, "探头");
        if (result !== undefined) {
          document.querySelector("#example-result").textContent = JSON.stringify(result);
        }
      });
    </script>
  </main>
</body>
</html>
