<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add length limits and filling tips to multi-line descriptions</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Add length limits and filling tips to multi-line descriptions</h1>
    <form>
      <label for="reason">Application Instructions</label>
      <p id="reason-guide">Describe the purpose of borrowing, no more than 120 words.</p>
      <textarea id="reason" name="reason" rows="4" maxlength="120" aria-describedby="reason-guide" required></textarea>
      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
