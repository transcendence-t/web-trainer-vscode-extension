<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark long citations, short citations and sources</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Mark long citations, short citations and sources</h1>
    <blockquote cite="https://example.org/observation"><p>Document findings first, discuss explanations later.</p></blockquote>
    <p>from<cite>"Community Observation Manual"</cite></p>
    <p>This week’s topic is<q>Pay attention to the changes around you</q>。</p>
  </main>
