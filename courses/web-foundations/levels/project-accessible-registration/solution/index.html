<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>制作可在本页反馈的实践课报名表</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>制作可在本页反馈的实践课报名表</h1>
    <form id="registration">
      <p><label for="name">姓名</label> <input id="name" name="name" required></p>
      <p><label for="email">联系邮箱</label> <input id="email" name="email" type="email" required></p>
      <p>
        <label for="course">场次</label>
        <select id="course" name="course" required>
          <option value="">请选择</option>
          <option>上午场</option>
          <option>下午场</option>
        </select>
      </p>
      <button type="submit">报名</button>
    </form>
    <p id="reply" role="status">尚未报名</p>
  </main>
</body>
</html>
