<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a practical course registration form that can be used for feedback on this page</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Create a practical course registration form that can be used for feedback on this page</h1>
    <form id="registration">
      <p>Name <input id="name"></p>
      <p>Contact email <input id="email"></p>
      <p>sessions <select id="course"><option value="">Please select</option><option>Morning session</option><option>Afternoon session</option></select></p>
      <button type="submit">Registration</button>
    </form>
    <p id="reply">has not registered yet</p>
  </main>
</body>
</html>
