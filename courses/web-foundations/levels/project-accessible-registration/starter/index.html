<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>制作可在本页反馈的实践课报名表</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>制作可在本页反馈的实践课报名表</h1>
    <form id="registration">
      <p>姓名 <input id="name"></p>
      <p>联系邮箱 <input id="email"></p>
      <p>场次 <select id="course"><option value="">请选择</option><option>上午场</option><option>下午场</option></select></p>
      <button type="submit">报名</button>
    </form>
    <p id="reply">尚未报名</p>
  </main>
</body>
</html>
