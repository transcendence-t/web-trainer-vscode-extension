<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>allows visitors to check multiple activities</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>allows visitors to check multiple activities</h1>
    <fieldset>
      <legend>What activities can you participate in?</legend>
      <label><input id="reading" type="checkbox" name="activity" value="reading"> Read in total</label>
      <label><input id="repair" type="checkbox" name="activity" value="repair"> Repair Workshop</label>
    </fieldset>
  </main>
</body>
</html>
