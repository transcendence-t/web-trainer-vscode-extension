<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>让访客可以勾选多项活动</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>让访客可以勾选多项活动</h1>
    <fieldset>
      <legend>你能参加哪些活动</legend>
      <label><input id="reading" type="checkbox" name="activity" value="reading"> 共读</label>
      <label><input id="repair" type="checkbox" name="activity" value="repair"> 修理工作坊</label>
    </fieldset>
  </main>
</body>
</html>
