<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>为登录表单声明自动填充用途</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>为登录表单声明自动填充用途</h1>
    <form>
      <p><label for="account">账号邮箱</label><br><input id="account" name="account" type="email"></p>
      <p><label for="password">现用密码</label><br><input id="password" name="password" type="password"></p>
      <button>登录</button>
    </form>
  </main>
</body>
</html>
