<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rehearsal track selection</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>Rehearsal track selection</h1>
  <ul id="song-list">
    <li><button type="button" data-title="Seaside Overture"><span>Seaside Overture</span></button></li>
    <li><button type="button" data-title="Mountain tune"><span>Mountain tune</span></button></li>
  </ul>
  <button id="add-song" type="button">Add backup track</button>
  <template id="extra-song">
    <li><button type="button" data-title="Blue Bridge March"><span>Blue Bridge March</span></button></li>
  </template>
  <p>current track <output id="selected-song">Not selected yet</output></p>
</main>
</body>
</html>
