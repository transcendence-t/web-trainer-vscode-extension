<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>采样记录</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>采样记录</h1>
  <button id="start-sampling" type="button">开始采样</button>
  <button id="stop-sampling" type="button" disabled>停止采样</button>
  <p id="sampling-status" role="status">等待启用</p>
  <ol id="sample-log" aria-label="采样记录"></ol>
</main>
</body>
</html>
