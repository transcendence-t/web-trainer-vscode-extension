<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sampling record</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>sampling record</h1>
  <button id="start-sampling" type="button">starts sampling</button>
  <button id="stop-sampling" type="button" disabled>stop sampling</button>
  <p id="sampling-status" role="status">waiting to be activated</p>
  <ol id="sample-log" aria-label="sampling record"></ol>
</main>
</body>
</html>
