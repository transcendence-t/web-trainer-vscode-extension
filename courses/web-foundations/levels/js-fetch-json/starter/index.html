<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Use Fetch to load local activity list</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Use Fetch to load local activity list</h1>
    <label for="dataset">local data sample</label>
    <select id="dataset">
      <option value="data:application/json;charset=utf-8,%7B%22activities%22%3A%5B%22Open%20pottery%20studio%22%2C%22woodwork%20display%22%5D%7D">Two activities</option>
      <option value="data:application/json;charset=utf-8,%7B%22activities%22%3A%5B%5D%7D">empty list</option>
      <option value="data:application/json,%7B">Corrupted Data</option>
    </select>
    <button type="button" id="load">loading activity</button>
    <p id="notice" role="status">waiting to load</p>
    <ul id="events"></ul>
  </main>
</body>
</html>
