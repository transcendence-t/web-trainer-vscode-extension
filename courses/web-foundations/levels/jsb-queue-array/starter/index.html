<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Move the last queue member to the beginning</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Move the last queue member to the beginning</h1>
    <p>give it a try <code>rotateLast(["one group", "two groups", "three groups"])</code></p>
    <p>running results <output id="example-result" aria-live="polite">Function to be filled in</output></p>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const result = rotateLast(["one set","Group 2","three groups"]);
        if (result !== undefined) {
          document.querySelector("#example-result").textContent = JSON.stringify(result);
        }
      });
    </script>
  </main>
</body>
</html>
