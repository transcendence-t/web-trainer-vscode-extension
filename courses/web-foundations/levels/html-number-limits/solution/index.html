<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>限定打印份数的范围和步长</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>限定打印份数的范围和步长</h1>
    <label for="copies">打印份数</label>
    <input id="copies" name="copies" type="number" min="2" max="20" step="2" required>
  </main>
</body>
</html>
