<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limit the range and step size of the number of print copies</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Limit the range and step size of the number of print copies</h1>
    <label for="copies">Number of copies to print</label>
    <input id="copies" name="copies" type="number" min="2" max="20" step="2" required>
  </main>
</body>
</html>
