<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小组展示待办</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>小组展示待办</h1>
  <form id="todo-form">
    <label for="task-input">待办事项</label>
    <div class="task-entry">
      <input id="task-input" name="task" type="text" placeholder="例如，收齐讲解稿">
      <button id="add-task" type="submit">添加</button>
    </div>
  </form>
  <ul id="task-list">
    <li class="task-row">
      <span class="task-title">核对展示顺序</span>
      <div class="task-actions">
        <button type="button" data-action="toggle" aria-pressed="false">完成</button>
        <button type="button" data-action="delete">删除</button>
      </div>
    </li>
  </ul>
  <template id="task-template">
    <li class="task-row">
      <span class="task-title"></span>
      <div class="task-actions">
        <button type="button" data-action="toggle" aria-pressed="false">完成</button>
        <button type="button" data-action="delete">删除</button>
      </div>
    </li>
  </template>
</main>
</body>
</html>
