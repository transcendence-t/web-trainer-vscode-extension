<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extract the label to be collected from the package object</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>Extract the label to be collected from the package object</h1>
  <p>sample call <code>listReadyPickups([{ label: "North Cabinet-03", ready: true }, { label: "South Cabinet-07", ready: false }])</code></p>
  <p>running results <output id="example-result">Function to be filled in</output></p>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const result = listReadyPickups([{ label: "North cabinet-03", ready: true }, { label: "South cabinet-07", ready: false }]);
      if (result !== undefined) {
        document.querySelector('#example-result').textContent = JSON.stringify(result);
      }
    });
  </script>
</main>
</body>
</html>
