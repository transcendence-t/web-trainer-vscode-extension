<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Only highlights notifications with two categories at the same time</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Only highlights notifications with two categories at the same time</h1>
    <p id="urgent-notice" class="notice urgent">East Gate is temporarily closed</p>
    <p id="plain-notice" class="notice">Open on weekends</p>
    <p id="plain-urgent" class="urgent">To be stamped</p>
  </main>
</body>
</html>
