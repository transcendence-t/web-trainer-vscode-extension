<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read single-value and multi-value fields in the form</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Read single-value and multi-value fields in the form</h1>
    <form id="application">
      <label for="visitor">Name</label> <input id="visitor" name="visitor" required>
      <fieldset><legend>can participate in the period</legend>
        <label><input id="morning" type="checkbox" name="session" value="Morning"> Morning</label>
        <label><input id="afternoon" type="checkbox" name="session" value="Afternoon"> Afternoon</label>
      </fieldset>
      <button type="submit">View receipt</button>
    </form>
    <p id="receipt" role="status">has not been submitted yet</p>
    <script>
      // allows the same page receipt to record whether the submission event has been intercepted.
      document.querySelector("#application").parentElement.addEventListener("submit", (event) => {
        document.querySelector("#receipt").dataset.inPlace = String(event.defaultPrevented);
      });
    </script>
  </main>
</body>
</html>
