<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekend Museum Tour</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>Weekend Museum Tour</h1>
  <label for="tour">Guided Tour Sessions</label>
  <select id="tour">
    <option value="">Please select a tour</option>
    <option value="ceramics">Ceramics Museum Morning Session</option>
    <option value="clocks">Watch and Clock Museum Afternoon Session</option>
    <option value="prints">Printmaking Museum Evening Session</option>
  </select>
  <p><output id="meeting-point">Please select the tour session first.</output></p>
</main>
</body>
</html>
