<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screening area seats</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>Screening area seats</h1>
  <p>sample call <code>screeningCapacity(4)</code></p>
  <p>running results <output id="example-result">Function to be filled in</output></p>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const result = screeningCapacity(4);
      if (result !== undefined) {
        document.querySelector('#example-result').textContent = JSON.stringify(result);
      }
    });
  </script>
</main>
</body>
</html>
