<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>equipment loan list</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>equipment loan list</h1>
  <div class="search-field">
    <span>device name</span>
    <input id="equipment-query" type="search" placeholder="Example: recording">
  </div>
  <p id="equipment-count" role="status"></p>
  <ul id="equipment-results" aria-label="matching equipment"></ul>
  <p id="equipment-empty" hidden>No matching device</p>
</main>
</body>
</html>
