<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Limit the date to the open week</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Limit the date to the open week</h1>
    <label for="visit-date">Estimated visit date</label>
    <input id="visit-date" name="visit-date" type="date" min="2027-06-10" max="2027-06-14" required>
    <p>Tours open June 10th through June 14th.</p>
  </main>
</body>
</html>
