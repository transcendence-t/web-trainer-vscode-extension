<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set the restore button to form reset</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Set the restore button to form reset</h1>
    <form>
      <label for="alias">Exhibition name</label>
      <input id="alias" name="alias" value="Model A">
      <button id="send" type="submit">Save</button>
      <button id="restore" type="reset">restore initial name</button>
    </form>
  </main>
</body>
</html>
