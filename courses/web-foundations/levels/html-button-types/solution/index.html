<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>把恢复按钮设为表单重置</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>把恢复按钮设为表单重置</h1>
    <form>
      <label for="alias">展签名称</label>
      <input id="alias" name="alias" value="模型 A">
      <button id="send" type="submit">保存</button>
      <button id="restore" type="reset">恢复初始名称</button>
    </form>
  </main>
</body>
</html>
