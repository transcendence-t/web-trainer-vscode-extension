<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classroom Material Screening</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>Classroom Material Screening</h1>
  <div class="field">
    <label for="topic-filter">Filter by topic</label>
    <input id="topic-filter" type="search" placeholder="For example, web page layout">
  </div>
  <div class="field">
    <label for="author-filter">Filter by author</label>
    <input id="author-filter" type="search" placeholder="For example, Teacher Li">
  </div>
</main>
</body>
</html>
