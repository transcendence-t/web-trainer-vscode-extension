<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>让表格内边框共享一条边</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>让表格内边框共享一条边</h1>
    <table><caption>实训室记录</caption><thead><tr><th>设备</th><th class="code">编号</th></tr></thead><tbody><tr><td>声级计</td><td class="code">108</td></tr><tr><td>温度计</td><td class="code">4</td></tr></tbody></table>
  </main>
</body>
</html>
