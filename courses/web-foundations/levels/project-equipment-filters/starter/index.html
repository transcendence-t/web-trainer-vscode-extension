<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filter and sort available workshop equipment</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Filter and sort available workshop equipment</h1>
    <p><label for="query">Equipment name</label> <input id="query" type="search"></p>
    <p><label for="room">training room</label> <select id="room"><option value="all">All</option><option value="design">design room</option><option value="photo">Photography Studio</option></select></p>
    <p><label for="order">Sort</label> <select id="order"><option value="asc">time from short to long</option><option value="desc">time from long to short</option></select></p>
    <p id="count" role="status">Waiting for display</p>
    <ul id="equipment"></ul>
  </main>
</body>
</html>
