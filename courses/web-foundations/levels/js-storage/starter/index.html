<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save visitor nickname</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>Save visitor nickname</h1>
  <label for="nickname">nickname</label>
  <input id="nickname" type="text" autocomplete="nickname">
  <button id="save-name" type="button">Save</button>
  <p>Nickname saved <output id="saved-name">No nickname yet</output></p>
</main>
</body>
</html>
