<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage the opening, closing and focus of native dialog boxes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Manage the opening, closing and focus of native dialog boxes</h1>
    <button id="open" type="button">Open instructions</button>
    <dialog id="rules-dialog" aria-labelledby="rules-title">
      <h2 id="rules-title">Check equipment before borrowing</h2>
      <p>is damaged, please contact the person on duty first.</p>
      <button id="dismiss" type="button">Close instructions</button>
    </dialog>
  </main>
</body>
</html>
