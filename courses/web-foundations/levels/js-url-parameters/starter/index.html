<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>parses the query conditions in the address</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>parses the query conditions in the address</h1>
    <p>give it a try <code>readFilters("?q=wood+craft&amp;tag=lab&amp;tag=weekend")</code></p>
    <p>running results <output id="example-result" aria-live="polite">Function to be filled in</output></p>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const result = readFilters("?q=wood+craft&tag=lab&tag=weekend");
        if (result !== undefined) {
          document.querySelector("#example-result").textContent = JSON.stringify(result);
        }
      });
    </script>
  </main>
</body>
</html>
