<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Put the total into the table footer</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Put the total into the table footer</h1>
    <table>
      <caption>Repair material receipt record</caption>
      <thead><tr><th scope="col">material</th><th scope="col">quantity</th></tr></thead>
      <tbody>
        <tr><th scope="row">canvas</th><td>4</td></tr>
        <tr><th scope="row">webbing</th><td>6</td></tr>
        <tr><th scope="row">Total</th><td>10</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
