<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Use HTTP status to determine whether to read the response body</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Use HTTP status to determine whether to read the response body</h1>
      <p>give it a try <code>makeResponseMessage(200, "{"message":"Record has been updated"}")</code></p>
    <p>running results <output id="example-result" aria-live="polite">Function to be filled in</output></p>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
          const result = await makeResponseMessage(200, "{\"message\":\"record updated\"}");
        if (result !== undefined) {
          document.querySelector("#example-result").textContent = JSON.stringify(result);
        }
      });
    </script>
  </main>
</body>
</html>
