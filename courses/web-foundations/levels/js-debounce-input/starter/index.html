<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>等输入暂停再执行本地搜索</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>等输入暂停再执行本地搜索</h1>
    <label for="filter">搜索资料</label> <input id="filter" type="search">
    <p>最近关键字 <output id="last-keyword">未搜索</output></p>
    <p>执行次数 <output id="hits">0</output></p>
  </main>
</body>
</html>
