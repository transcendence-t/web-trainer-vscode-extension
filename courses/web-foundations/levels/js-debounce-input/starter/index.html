<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Debounce a local search until typing pauses</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Debounce a local search until typing pauses</h1>
    <label for="filter">Search information</label> <input id="filter" type="search">
    <p>Latest search <output id="last-keyword">not searched</output></p>
    <p>execution times <output id="hits">0</output></p>
  </main>
</body>
</html>
