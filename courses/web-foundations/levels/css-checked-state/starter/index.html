<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>让已勾选的器材文字变粗</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>让已勾选的器材文字变粗</h1>
    <p><label><input type="checkbox" id="lamp"><span>工作灯</span></label></p>
    <p><label><input type="checkbox" id="gloves" checked><span>防护手套</span></label></p>
  </main>
</body>
</html>
