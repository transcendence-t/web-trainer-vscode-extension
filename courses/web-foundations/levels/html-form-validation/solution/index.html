<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-service pickup</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>Self-service pickup</h1>
  <form>
    <label for="pickup-code">pickup code</label>
    <input type="text" id="pickup-code" name="pickup" required pattern="[A-Z]{2}[0-9]{4}">
    <p>pickup code consists of two uppercase English letters and four digits, such as AB0427.</p>
    <button type="submit">Check</button>
  </form>
</main>
</body>
</html>
