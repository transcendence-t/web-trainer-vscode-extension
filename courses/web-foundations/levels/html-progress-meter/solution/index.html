<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>distinguishes current progress and capacity readings</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>distinguishes current progress and capacity readings</h1>
    <label for="upload">upload progress</label> <progress id="upload" value="6" max="10">6 / 10</progress>
    <br>
    <label for="capacity">storage usage</label> <meter id="capacity" min="0" max="100" value="65">65 / 100</meter>
  </main>
</body>
</html>
