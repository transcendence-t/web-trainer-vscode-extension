<body>
<main class="sheet">
  <h1>Tidal Walk Route</h1>
  <article class="walk-card">
    <h2>North Bridge to Observation Deck</h2>
    <p>Walk along the seawall, passing by the wind shelter. The whole journey takes about 20 minutes.</p>
