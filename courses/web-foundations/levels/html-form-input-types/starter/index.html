<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>让浏览器检查邮箱和网址格式</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>让浏览器检查邮箱和网址格式</h1>
    <form>
      <p><label for="email">联系邮箱</label><br><input id="email" name="email" required></p>
      <p><label for="work">作品网址</label><br><input id="work" name="work" required></p>
      <button>提交</button>
    </form>
  </main>
</body>
</html>
