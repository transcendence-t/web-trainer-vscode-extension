<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let the browser check the email and URL format</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Let the browser check the email and URL format</h1>
    <form>
      <p><label for="email">Contact email</label><br><input id="email" type="email" name="email" required></p>

      <button>Submit</button>
    </form>
  </main>
</body>
</html>
