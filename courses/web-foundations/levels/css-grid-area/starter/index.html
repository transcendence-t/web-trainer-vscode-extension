<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theater Scheduling Board</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>Theater Scheduling Board</h1>
  <div class="show-board">
    <section class="card show-overview">
      <h2>Today’s overview</h2>
      <p>The two shows start at 14:00 and 19:30 respectively.</p>
    </section>
    <section class="card stage-crew">
      <h2>stage collaboration</h2>
      <p>Check lights and subtitles one hour before showtime.</p>
    </section>
    <section class="card front-desk">
      <h2>Ticket check-in arrangement</h2>
      <p>Ticket inspection is open forty minutes before each performance.</p>
    </section>
  </div>
</main>
</body>
</html>
