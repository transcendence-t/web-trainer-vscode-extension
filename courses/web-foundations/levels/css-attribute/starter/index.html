<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>场馆使用申请</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>场馆使用申请</h1>
  <form>
    <div class="field">
      <label for="applicant-name">姓名（必填）</label>
      <input id="applicant-name" name="name" type="text" required>
    </div>
    <div class="field">
      <label for="applicant-email">邮箱（必填）</label>
      <input id="applicant-email" name="email" type="email" required>
    </div>
    <div class="field">
      <label for="phone-number">联系电话（选填）</label>
      <input id="phone-number" name="phone" type="tel">
    </div>
  </form>
</main>
</body>
</html>
