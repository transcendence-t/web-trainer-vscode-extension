<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application for venue use</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>Application for venue use</h1>
  <form>
    <div class="field">
      <label for="applicant-name">Name (required)</label>
      <input id="applicant-name" name="name" type="text" required>
    </div>
    <div class="field">
      <label for="applicant-email">Email (required)</label>
      <input id="applicant-email" name="email" type="email" required>
    </div>
    <div class="field">
      <label for="phone-number">Contact number (optional)</label>
      <input id="phone-number" name="phone" type="tel">
    </div>
  </form>
</main>
</body>
</html>
