<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shared equipment reservation</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>shared equipment reservation</h1>
  <div class="equipment-stage">
    <div class="equipment-grid">
      <article class="equipment-card" id="projector">
        <h2>portable projector</h2>
        <p>is suitable for group display. Please inventory the wires before returning them.</p>
      </article>
      <article class="equipment-card" id="recorder">
        <h2>recording kit</h2>
        <p>includes a voice recorder, lavalier microphone and adapter cable.</p>
      </article>
    </div>
  </div>
</main>
</body>
</html>
