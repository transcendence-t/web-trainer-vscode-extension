<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>馆藏检索</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>馆藏检索</h1>
  <form>
    <label for="book-query">馆藏关键词</label>
    <div class="query-bar">
      <input type="search" id="book-query" name="query" placeholder="输入书名">
      <button type="submit" id="query-button">查询</button>
    </div>
  </form>
</main>
</body>
</html>
