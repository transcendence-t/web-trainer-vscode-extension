<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create offline workshop notification board</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Create offline workshop notification board</h1>
    <label for="demo">response sample</label>
    <select id="demo">
      <option value="main">Notice this week</option>
      <option value="empty">empty list</option>
      <option value="error">bad data</option>
    </select>
    <button id="refresh" type="button">loading notification</button>
    <p id="state" role="status">waiting to load</p>
    <ul id="notices"></ul>
  </main>
</body>
</html>
