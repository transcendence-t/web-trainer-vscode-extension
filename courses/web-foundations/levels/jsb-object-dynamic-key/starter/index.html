<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read the corresponding data according to the field name</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Read the corresponding data according to the field name</h1>
    <p>give it a try <code>readField({"rack-id":"B7","count":0}, "rack-id")</code></p>
    <p>running results <output id="example-result" aria-live="polite">Function to be filled in</output></p>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const result = readField({"rack-id":"B7","count":0}, "rack-id");
        if (result !== undefined) {
          document.querySelector("#example-result").textContent = JSON.stringify(result);
        }
      });
    </script>
  </main>
</body>
</html>
