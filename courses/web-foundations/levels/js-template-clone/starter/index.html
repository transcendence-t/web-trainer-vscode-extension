<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clone multiple equipment cards from template</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Clone multiple equipment cards from template</h1>
    <button type="button" id="build">Generate equipment card</button>
    <ul id="cards"></ul>
    <template id="card-template">
      <li><strong class="model"></strong> <span class="code"></span></li>
    </template>
  </main>
</body>
</html>
