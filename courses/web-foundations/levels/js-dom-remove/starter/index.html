<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>删除按钮所在的一条记录</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>删除按钮所在的一条记录</h1>
    <ul id="rows">
      <li id="lamp">摄影灯 <button class="remove" type="button"><span>移除</span></button></li>
      <li id="stand">支架 <button class="remove" type="button"><span>移除</span></button></li>
      <li id="camera">相机 <button class="remove" type="button"><span>移除</span></button></li>
    </ul>
  </main>
</body>
</html>
