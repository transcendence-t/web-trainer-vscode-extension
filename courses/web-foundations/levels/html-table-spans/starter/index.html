<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>allows the two layers of headers to be correctly aligned</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>allows the two layers of headers to be correctly aligned</h1>
    <table>
      <caption>Weekend venue schedule</caption>
      <thead>
        <tr><th>Venue</th><th>Saturday and Sunday</th></tr>
        <tr><th></th><th scope="col">Saturday</th><th scope="col">Sunday</th></tr>
      </thead>
      <tbody>
        <tr><th scope="row">Wood Workshop</th><td>Morning</td><td>Afternoon</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
