<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiking Collection Announcement</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>Hiking Collection Announcement</h1>
  <div class="route-board">
    <section class="card route-notice">
      <h2>Change of meeting place</h2>
      <p>will meet at the west gate of the Wetland Park this Saturday, and the check-in time will still be 9:00 am.</p>
    </section>
    <section class="card route-map">
      <h2>route arrangement</h2>
      <p>Take a circuit from Ximen along the lake trail.</p>
    </section>
    <section class="card gear-list">
      <h2>equipment list</h2>
      <p>Water bottle, sun hat and non-slip shoes.</p>
    </section>
  </div>
</main>
</body>
</html>
