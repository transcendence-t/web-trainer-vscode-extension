<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>web shorthand card</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>web shorthand card</h1>
  <p id="card-position"></p>
  <section class="study-card" aria-label="shorthand card" aria-live="polite">
    <p id="card-question"></p>
    <p id="card-answer" hidden></p>
  </section>
  <button id="flip-card" type="button" aria-controls="card-answer" aria-expanded="false">Show answer</button>
  <button id="next-card" type="button">Next</button>
</main>
</body>
</html>
