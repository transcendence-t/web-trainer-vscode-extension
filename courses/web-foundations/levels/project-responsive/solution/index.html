<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社区旧书交换日</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<div class="sheet">
  <header class="site-header">
    <p class="site-name">河畔社区图书角</p>
    <nav class="site-nav" aria-label="页内导航">
      <a href="#schedule">活动安排</a>
      <a href="#visit">到场方式</a>
    </nav>
  </header>
  <main class="reading-content">
    <h1>社区旧书交换日</h1>
    <div class="details">
      <section class="detail-card" id="schedule">
        <h2>活动安排</h2>
        <p>周六 10:00 开始收书，11:00 开放交换桌。</p>
        <p>每位参与者可以带一到三本适合交换的旧书。</p>
      </section>
      <section class="detail-card" id="visit">
        <h2>到场方式</h2>
        <p>从河畔社区中心南门进入，到一楼图书角签到。</p>
      </section>
    </div>
  </main>
  <footer class="site-footer"><p>河畔社区图书角组织</p></footer>
</div>

</html>
