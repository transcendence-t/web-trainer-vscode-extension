<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Required input box adjusted according to format status</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Required input box adjusted according to format status</h1>
    <label for="contact">Contact email</label>
    <input id="contact" type="email" required aria-describedby="contact-rule">
    <p id="contact-rule">Fill in a valid email address containing @.</p>
  </main>
</body>
</html>
