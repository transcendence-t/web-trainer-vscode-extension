<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>搭建适合手机和桌面的工坊看板</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="dashboard">
    <header id="top"><h1>实训工坊</h1><p>借用安排与最近的安全检查。</p></header>
    <nav id="links" class="links" aria-label="看板目录"><a href="#status">工位状态</a><a href="#hours">开放时间</a></nav>
    <section id="status">
      <h2>工位状态</h2>
      <div class="cards">
        <article id="wood"><h3>木作区</h3><p>开放</p></article>
        <article id="model"><h3>模型区</h3><p>整理中</p></article>
      </div>
      <p id="hours">工作日 09:00 至 17:00 开放。</p>
    </section>
  </main>
</body>
</html>
