<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build a workshop signboard suitable for mobile phones and desktops</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="dashboard">
    <div id="top"><h1>practical training workshop</h1><p>Loan arrangement with recent security inspection.</p></div>
    <div id="links" class="links"><a href="#status">workstation status</a><a href="#hours">opening hours</a></div>
    <section id="status">
      <h2>workstation status</h2>
      <div class="cards">
        <article id="wood"><h3>woodworking area</h3><p>Open</p></article>
        <article id="model"><h3>model area</h3><p>is being sorted out</p></article>
      </div>
      <p id="hours">Open weekdays from 09:00 to 17:00.</p>
    </section>
  </main>
</body>
</html>
