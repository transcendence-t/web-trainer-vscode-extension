<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read data attributes from the bound button</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Read data attributes from the bound button</h1>
    <button type="button" class="room-button" data-room-code="A-301"><span>Design Exhibition Area</span></button>
    <button type="button" class="room-button" data-room-code="B-105"><span>Production Exhibition Area</span></button>
    <p id="selection" role="status">Select an exhibition area</p>
  </main>
</body>
</html>
