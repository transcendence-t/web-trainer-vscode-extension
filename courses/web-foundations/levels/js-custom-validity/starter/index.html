<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hands the matching results of the two password fields to the browser</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>Hands the matching results of the two password fields to the browser</h1>
    <form>
    <p><label for="password">new password</label> <input id="password" type="password" required></p>
    <p><label for="confirm">Confirm password</label> <input id="confirm" type="password" required aria-describedby="feedback"></p>
    <p id="feedback" role="status"></p><button type="submit">settings</button>
    </form>
  </main>
</body>
</html>
