<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saturday neighborhood market</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>Saturday neighborhood market</h1>
  <div class="stations">
    <article class="card book-stall">
      <h2>Old book exchange</h2>
      <p>Bring a finished book in exchange.</p>
    </article>
    <article class="card produce-stall">
      <h2>Seasonal fruits and vegetables</h2>
      <p>will be delivered to a nearby orchard in the morning.</p>
    </article>
    <article class="card repair-stall">
      <h2>Object Repair</h2>
      <p>Sign up to repair small daily necessities.</p>
    </article>
  </div>
</main>
</body>
</html>
