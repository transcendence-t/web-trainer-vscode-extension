<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地登录演示</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>本地登录演示</h1>
  <p>演示账号 <code>learner</code>，密码 <code>study123</code>。</p>
  <form id="login-form" novalidate autocomplete="off">
    <div class="field">
      <label for="login-name">账号</label>
      <input type="text" id="login-name" name="username">
    </div>
    <div class="field">
      <label for="login-password">密码</label>
      <input type="text" id="login-password" name="password">
    </div>
    <button id="login-submit" type="submit">登录</button>
  </form>
  <p id="login-status" aria-live="polite">请输入演示账号和密码。</p>
</main>
</body>
</html>
