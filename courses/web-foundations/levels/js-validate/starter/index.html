<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Film Festival Submission Registration</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main class="sheet">
  <h1>Film Festival Submission Registration</h1>
  <form id="submission-form" novalidate>
    <label for="work-title">Title of Work</label>
    <input id="work-title" name="title" type="text">
    <button type="submit">Submit for inspection</button>
  </form>
  <p><output id="submission-feedback">Fill in the title and submit for inspection.</output></p>
  <script>
    document.querySelector('.sheet').addEventListener('submit', (event) => {
      if (!event.defaultPrevented) {
        event.preventDefault();
        document.querySelector('#submission-feedback').textContent = 'Please prevent default submission in the submit listener first.';
      }
    });
  </script>
</main>
</body>
</html>
