<main class="sheet">
  <h1>Glossary of Birding Terms</h1>
  <dl>
    <dt>wingspan</dt>
    <dd>The distance between the wing tips on both sides when the wings are unfolded.</dd>
    <dt>resident bird</dt>
    <dd>A bird that stays in the same area year-round.</dd>
  </dl>
