<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>only displays the last four digits of the ticket number</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <h1>only displays the last four digits of the ticket number</h1>
    <p>give it a try <code>lastDigits("LN0018")</code></p>
    <p>running results <output id="example-result" aria-live="polite">Function to be filled in</output></p>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const result = lastDigits("LN0018");
        if (result !== undefined) {
          document.querySelector("#example-result").textContent = JSON.stringify(result);
        }
      });
    </script>
  </main>
</body>
</html>
